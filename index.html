<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas Campinas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0b0f1a;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 15px;
  }

  .table-container {
    width: 100%;
    overflow-x: auto;
  }

  table {
    margin: auto;
    border-collapse: collapse;
    width: 100%;
    max-width: 1000px;
    background: #121826;
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: #1f2937;
    color: #00ff88;
    text-transform: uppercase;
    font-size: 13px;
    padding: 12px;
    text-align: left;
  }

  td {
    color: #ffffff !important;
    padding: 12px;
    border-bottom: 1px solid #1f2937;
    text-align: left;
  }

  tr:hover {
    background: #1a2332;
  }

  @media (max-width: 600px) {
    thead { display: none; }
    tr {
      display: block;
      margin-bottom: 12px;
      background: #121826;
      border-radius: 10px;
      padding: 10px;
    }
    td {
      display: block;
      border: none;
      padding: 6px 0;
      font-size: 14px;
    }
    td::before {
      font-weight: bold;
      color: #00ff88;
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }
    td:nth-child(1)::before { content: "Data e Hora"; }
    td:nth-child(2)::before { content: "Barbeiro"; }
    td:nth-child(3)::before { content: "Forma PG"; }
    td:nth-child(4)::before { content: "Valor"; }
  }
</style>
</head>
<body>

<h2>Comandas Campinas 🔐</h2>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Data e Hora</th>
        <th>Barbeiro</th>
        <th>Forma PG</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="tabela">
      <tr><td colspan="4">Carregando dados...</td></tr>
    </tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const acesso = params.get("acesso") ?? "";

const API = "https://script.google.com/macros/s/AKfycbyHUG9oKBjNZGSgPCdcRt6Kequ5Uo9h9IaF_h0-8eq2aGJZ6jHEfij22p8IgzSHuhM5Mw/exec";

function formatarMoeda(valor) {
  const numero = parseFloat(valor);
  if (isNaN(numero)) return "R$ 0,00";
  return numero.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

// --- FUNÇÃO DE DATA CORRIGIDA ---
function formatarData(dataRaw) {
  if (!dataRaw) return "---";

  let d;

  // Tenta tratar se for string manual (DD/MM/AAAA)
  if (typeof dataRaw === "string" && dataRaw.includes("/")) {
    const partes = dataRaw.split(" ");
    const dataPart = partes[0];
    const horaPart = partes[1] || "00:00:00";
    
    const [dia, mes, ano] = dataPart.split("/");
    const [h, m, s] = horaPart.split(":");
    d = new Date(ano, mes - 1, dia, h, m, s);
  } else {
    // Tenta converter objeto Date do Google ou ISO
    d = new Date(dataRaw);
  }

  // Se a data for inválida, retorna o texto original para não ficar em branco
  if (isNaN(d.getTime())) return dataRaw;

  const dia = String(d.getDate()).padStart(2, "0");
  const mes = String(d.getMonth() + 1).padStart(2, "0");
  const ano = d.getFullYear();
  const hora = String(d.getHours()).padStart(2, "0");
  const min = String(d.getMinutes()).padStart(2, "0");
  const seg = String(d.getSeconds()).padStart(2, "0");

  return `${dia}/${mes}/${ano} ${hora}:${min}:${seg}`;
}

function carregarDados() {
  const tabela = document.getElementById("tabela");

  fetch(`${API}?acesso=${acesso}`)
    .then(res => res.json())
    .then(data => {
      tabela.innerHTML = "";

      if (data.erro) {
        tabela.innerHTML = "<tr><td colspan='4'>🔒 Acesso negado</td></tr>";
        return;
      }

      if (data.length === 0) {
        tabela.innerHTML = "<tr><td colspan='4'>Nenhum registro encontrado.</td></tr>";
        return;
      }

      data.reverse().forEach(item => {
        // Tenta encontrar a data em diferentes nomes de coluna possíveis
        const dataHoraOriginal = item.dataHora || item["Data e Hora"] || item.timestamp || item.Data || "";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatarData(dataHoraOriginal)}</td>
          <td>${item.barbeiro ?? ""}</td>
          <td>${item.AA ?? ""}</td>
          <td>
            ${
              item.AA?.toLowerCase() === "assinatura"
                ? (item.AB ?? "0")
                : formatarMoeda(item.AB)
            }
          </td>
        `;
        tabela.appendChild(tr);
      });
    })
    .catch(err => {
      console.error(err);
      tabela.innerHTML = "<tr><td colspan='4'>⚠️ Erro ao carregar</td></tr>";
    });
}

// Inicia e define o intervalo
carregarDados();
setInterval(carregarDados, 10000);
</script>

</body>
</html>
