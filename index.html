<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0b0f1a;
    color: #fff;
  }

  header {
    background: #111827;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
  }

  .container {
    padding: 10px;
    max-width: 900px;
    margin: auto;
  }

  .topo {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .card {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.4);
  }

  .linha {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
    font-size: 14px;
  }

  .valor {
    color: #22c55e;
    font-weight: bold;
    font-size: 16px;
  }

  .data {
    color: #9ca3af;
    font-size: 12px;
  }

  /* PC → tabela */
  @media (min-width: 700px) {
    .cards {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    th {
      background: #111827;
    }

    .valor {
      font-size: 14px;
    }
  }

  /* Mobile → cards */
  @media (max-width: 699px) {
    table {
      display: none;
    }
  }

</style>
</head>

<body>

<header>Comandas</header>

<div class="container">

  <div class="topo">
    <div id="atualizacao">Atualizando...</div>
  </div>

  <!-- MOBILE -->
  <div class="cards" id="cards"></div>

  <!-- PC -->
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Barbeiro</th>
        <th>FormaPG</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlvzX6W8ZPYB2QSicxv6LXWv0Xc1TuhcoSbcCd5JskarjMueLhZzwuTzjPfZXPgNozYrjxdfmOEqIB/pub?gid=85219282&single=true&output=csv";

function parseDataBR(dataStr) {
  if (!dataStr) return new Date(0);

  const partes = dataStr.split(" ");
  if (partes.length >= 2) {
    const [dia, mes, ano] = partes[0].split("/");
    const hora = partes[1];
    return new Date(`${ano}-${mes}-${dia}T${hora}`);
  }

  return new Date(dataStr);
}

function formatarValor(v) {
  const num = parseFloat(v) || 0;
  return num.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function carregarDados() {
  fetch(URL)
    .then(res => res.text())
    .then(texto => {
      const linhas = texto.split("\n");

      let dados = [];

      linhas.forEach((linha, index) => {
        if (index === 0) return;

        const col = linha.split(",");

        dados.push({
          data: col[1],
          barbeiro: col[6],
          forma: col[26],
          valor: parseFloat(col[27]) || 0,
          dataObj: parseDataBR(col[1])
        });
      });

      // ordenar mais recente
      dados.sort((a,b) => b.dataObj - a.dataObj);

      // horário atualização
      document.getElementById("atualizacao").innerText =
        "Atualizado: " + new Date().toLocaleTimeString("pt-BR");

      // MOBILE
      let htmlCards = "";
      dados.forEach(item => {
        htmlCards += `
          <div class="card">
            <div class="data">${item.data}</div>
            <div class="linha"><strong>${item.barbeiro}</strong></div>
            <div class="linha">${item.forma}</div>
            <div class="valor">${formatarValor(item.valor)}</div>
          </div>
        `;
      });

      document.getElementById("cards").innerHTML = htmlCards;

      // PC
      let htmlTabela = "";
      dados.forEach(item => {
        htmlTabela += `
          <tr>
            <td>${item.data}</td>
            <td>${item.barbeiro}</td>
            <td>${item.forma}</td>
            <td class="valor">${formatarValor(item.valor)}</td>
          </tr>
        `;
      });

      document.getElementById("tabela").innerHTML = htmlTabela;

    })
    .catch(() => {
      document.getElementById("cards").innerHTML = "Erro ao carregar";
    });
}

// auto atualização
setInterval(carregarDados, 10000);

// inicial
carregarDados();
</script>

</body>
</html>
