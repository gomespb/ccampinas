<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0b0f1a;
    color: #fff;
  }

  header {
    background: #111827;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
  }

  .container {
    padding: 10px;
    max-width: 900px;
    margin: auto;
  }

  .topo {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .card {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
  }

  .linha {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
  }

  .valor {
    color: #22c55e;
    font-weight: bold;
    text-align: right;
  }

  .destaque {
    color: #f59e0b;
    font-weight: bold;
    text-align: right;
  }

  /* PC */
  @media (min-width: 700px) {
    .cards { display: none; }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #333;
    }

    th { background: #111827; }

    th:nth-child(1), td:nth-child(1) { width: 30%; }
    th:nth-child(2), td:nth-child(2) { width: 25%; }
    th:nth-child(3), td:nth-child(3) { width: 25%; }
    th:nth-child(4), td:nth-child(4) { width: 20%; text-align: right; }
  }

  /* Mobile */
  @media (max-width: 699px) {
    table { display: none; }
  }
</style>
</head>

<body>

<header>Comandas</header>

<div class="container">

  <div class="topo">
    <div id="atualizacao">Carregando...</div>
  </div>

  <!-- MOBILE -->
  <div class="cards" id="cards"></div>

  <!-- PC -->
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Barbeiro</th>
        <th>FormaPG</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx5AjBMSv8PRyLZ8ZybBWDOaAsyrNomef3PIcFj9IqSdGWLtQoZxSSZI06iJiX5J3pUlQ/exec";

function parseDataBR(dataStr) {
  if (!dataStr) return new Date(0);

  const partes = dataStr.split(" ");
  if (partes.length >= 2) {
    const [dia, mes, ano] = partes[0].split("/");
    const hora = partes[1];
    return new Date(`${ano}-${mes}-${dia}T${hora}`);
  }

  return new Date(dataStr);
}

function formatarValor(v) {
  const num = parseFloat(v) || 0;

  if (num === 1 || num === 2 || num === 3) {
    return { texto: num, classe: "destaque" };
  }

  return {
    texto: num.toLocaleString("pt-BR", {
      style: "currency",
      currency: "BRL"
    }),
    classe: "valor"
  };
}

function bloquearTela(msg) {
  document.body.innerHTML = `
    <div style="
      display:flex;
      height:100vh;
      align-items:center;
      justify-content:center;
      font-family:Arial;
      background:#0b0f1a;
      color:#fff;
      text-align:center;
    ">
      <h2>${msg}</h2>
    </div>
  `;
}

function carregarDados() {
  const params = new URLSearchParams(window.location.search);
  const acesso = params.get("acesso");

  if (!acesso) {
    bloquearTela("Acesso não autorizado");
    return;
  }

  const URL = SCRIPT_URL + "?acesso=" + acesso;

  fetch(URL)
    .then(res => res.json())
    .then(dados => {

      if (dados.erro) {
        bloquearTela("Acesso negado");
        return;
      }

      dados.forEach(item => {
        item.dataObj = parseDataBR(item.data);
      });

      dados.sort((a,b) => b.dataObj - a.dataObj);

      document.getElementById("atualizacao").innerText =
        "Atualizado: " + new Date().toLocaleTimeString("pt-BR");

      // MOBILE
      let htmlCards = "";
      dados.forEach(item => {
        const v = formatarValor(item.valor);

        htmlCards += `
          <div class="card">
            <div class="linha"><span>Data:</span><span>${item.data}</span></div>
            <div class="linha"><span>Barbeiro:</span><strong>${item.barbeiro}</strong></div>
            <div class="linha"><span>Forma:</span><span>${item.forma}</span></div>
            <div class="linha"><span>Valor:</span><span class="${v.classe}">${v.texto}</span></div>
          </div>
        `;
      });

      document.getElementById("cards").innerHTML = htmlCards;

      // PC
      let htmlTabela = "";
      dados.forEach(item => {
        const v = formatarValor(item.valor);

        htmlTabela += `
          <tr>
            <td>${item.data}</td>
            <td>${item.barbeiro}</td>
            <td>${item.forma}</td>
            <td class="${v.classe}">${v.texto}</td>
          </tr>
        `;
      });

      document.getElementById("tabela").innerHTML = htmlTabela;

    })
    .catch(() => {
      bloquearTela("Erro ao carregar");
    });
}

setInterval(carregarDados, 10000);
carregarDados();
</script>

</body>
</html>
