<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas Campinas</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial;
    background: #0b0f1a;
    color: #fff;
    text-align: center;
    margin: 0;
    padding: 15px;
  }

  .table-container {
    width: 100%;
    overflow-x: auto;
  }

  table {
    margin: auto;
    border-collapse: collapse;
    width: 100%;
    max-width: 900px;
    background: #121826;
    border-radius: 10px;
    overflow: hidden;
  }

  th {
    background: #1f2937;
    color: #00ff88;
    text-transform: uppercase;
    font-size: 13px;
  }

  td {
    color: #ffffff !important;
  }

  td, th {
    padding: 12px;
    border-bottom: 1px solid #1f2937;
    text-align: left;
  }

  tr:hover {
    background: #1a2332;
  }

  @media (max-width: 600px) {
    thead { display: none; }

    tr {
      display: block;
      margin-bottom: 12px;
      background: #121826;
      border-radius: 10px;
      padding: 10px;
    }

    td {
      display: block;
      border: none;
      padding: 6px 0;
      font-size: 14px;
      color: #ffffff !important;
    }

    td::before {
      font-weight: bold;
      color: #00ff88;
      display: block;
      font-size: 12px;
      margin-bottom: 2px;
    }

    td:nth-child(1)::before { content: "Data e Hora"; }
    td:nth-child(2)::before { content: "Barbeiro"; }
  }
</style>
</head>

<body>

<h2>Comandas Campinas</h2>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Data e Hora</th>
        <th>Barbeiro</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>
</div>

<script>
const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlvzX6W8ZPYB2QSicxv6LXWv0Xc1TuhcoSbcCd5JskarjMueLhZzwuTzjPfZXPgNozYrjxdfmOEqIB/pub?gid=85219282&single=true&output=csv";

// 🔗 PEGAR ACESSO DA URL
const params = new URLSearchParams(window.location.search);
const acesso = params.get("acesso") || "";

// 🔐 MAPA DE ACESSO → NOME REAL
const acessos = {
  "Claudia303132": "Claudia",
  "Obert5050": "Obert",
  "Tiago2727": "Tiago",
  "admin9999": "admin"
};

// 🔍 DESCOBRE O FILTRO REAL
const filtro = acessos[acesso] || null;

// 🔥 NORMALIZAR TEXTO (ignora acento e maiúsculas)
function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function carregarDados() {

  const tabela = document.getElementById("tabela");

  // 🔒 BLOQUEIA ACESSO INVÁLIDO
  if (!filtro) {
    tabela.innerHTML = "<tr><td colspan='2'>🔒 Acesso inválido</td></tr>";
    return;
  }

  fetch(url)
    .then(response => response.text())
    .then(data => {

      const linhas = data.split("\n").reverse();
      tabela.innerHTML = "";

      linhas.forEach((linha, index) => {

        if (index === linhas.length - 1) return;
        if (!linha.trim()) return;

        const colunas = linha.split(",");

        const col2 = colunas[1] || "";
        const col7 = colunas[6] || "";

        if (!col2 && !col7) return;

        // 🔥 FILTRO
        if (filtro !== "admin") {
          if (!normalizar(col7).includes(normalizar(filtro))) return;
        }

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${col2}</td>
          <td>${col7}</td>
        `;

        tabela.appendChild(tr);
      });
    })
    .catch(err => console.error("Erro:", err));
}

carregarDados();

// 🔄 Atualiza a cada 10 segundos
setInterval(carregarDados, 10000);
</script>

</body>
</html>
