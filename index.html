<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas Campinas</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #0b0f1a;
    color: #fff;
  }

  header {
    background: #111827;
    padding: 15px;
    text-align: center;
    font-size: 18px;
    font-weight: bold;
  }

  .container {
    padding: 10px;
    max-width: 1100px;
    margin: auto;
  }

  .topo {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
  }

  /* 🔥 MENU LOTES */
  #menuLotes {
    margin-bottom: 15px;
  }

  .lote {
    display: none;
  }

  .botao {
    display: block;
    padding: 12px;
    margin: 6px 0;
    background: linear-gradient(135deg, #19a7ce, #146c94);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    text-align: center;
    font-weight: bold;
    transition: 0.2s;
  }

  .botao:hover {
    transform: scale(1.03);
  }

  /* 🔥 TABELA */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }

  th, td {
    padding: 10px;
    border-bottom: 1px solid #333;
    text-align: left;
    white-space: nowrap;
  }

  th {
    background: #111827;
  }

  th:nth-child(1), td:nth-child(1) { width: 30%; }
  th:nth-child(2), td:nth-child(2) { width: 25%; }
  th:nth-child(3), td:nth-child(3) { width: 25%; }
  th:nth-child(4), td:nth-child(4) { width: 20%; text-align: right; }

  .valor {
    color: #22c55e;
    font-weight: bold;
  }

  .destaque {
    color: #f59e0b;
    font-weight: bold;
  }

  /* MOBILE */
  @media (max-width: 699px) {
    table { display: none; }

    .card {
      background: #111827;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .linha {
      display: flex;
      justify-content: space-between;
      margin: 4px 0;
    }
  }

  /* PC */
  @media (min-width: 700px) {
    .cards { display: none; }
  }
</style>
</head>

<body>

<header>Comandas Campinas</header>

<div class="container">

  <div class="topo">
    <div id="usuarioNome"></div>
    <div id="atualizacao">Carregando...</div>
  </div>

  <!-- 🔥 MENU LOTES -->
  <div id="menuLotes">

    <div id="lote1" class="lote">
      <a href="#" class="botao">Agenda</a>
      <a href="#" class="botao">Relatório</a>
      <a href="#" class="botao">Financeiro</a>
    </div>

    <div id="lote2" class="lote">
      <a href="#" class="botao">Agenda</a>
      <a href="#" class="botao">Relatório</a>
      <a href="#" class="botao">Financeiro</a>
    </div>

    <div id="lote3" class="lote">
      <a href="#" class="botao">Agenda</a>
      <a href="#" class="botao">Relatório</a>
      <a href="#" class="botao">Financeiro</a>
    </div>

    <div id="lote4" class="lote">
      <a href="#" class="botao">Admin</a>
      <a href="#" class="botao">Controle</a>
      <a href="#" class="botao">Relatórios</a>
    </div>

  </div>

  <!-- MOBILE -->
  <div class="cards" id="cards"></div>

  <!-- PC -->
  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Barbeiro</th>
        <th>FormaPG</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="tabela"></tbody>
  </table>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwF6LYH0jY23jjF-pH_WGnq6OznGxwKVj7FD5qzy6_gbw0oC2zoYTmHl0H7Yrf68xJTHA/exec";

// 🔐 MAPA COMPLETO
const usuarios = {
  "Tiago252627": { nome: "Tiago", lote: "lote1" },
  "Claudia26022025": { nome: "Claudia", lote: "lote2" },
  "Obert505152": { nome: "Obert", lote: "lote3" },
  "boleta1981": { nome: "Admin", lote: "lote4" }
};

function parseDataBR(dataStr) {
  if (!dataStr) return new Date(0);
  const [d, h] = dataStr.split(" ");
  const [dia, mes, ano] = d.split("/");
  return new Date(`${ano}-${mes}-${dia}T${h}`);
}

function formatarValor(v) {
  const num = parseFloat(v) || 0;

  if (num <= 3) {
    return { texto: num, classe: "destaque" };
  }

  return {
    texto: num.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }),
    classe: "valor"
  };
}

function bloquearTela(msg) {
  document.body.innerHTML = `
    <div style="display:flex;height:100vh;align-items:center;justify-content:center;">
      <h2>${msg}</h2>
    </div>
  `;
}

function carregarDados() {
  const params = new URLSearchParams(window.location.search);
  const acesso = params.get("acesso");

  if (!acesso || !usuarios[acesso]) {
    bloquearTela("Acesso não autorizado");
    return;
  }

  const user = usuarios[acesso];

  // 🔥 mostra nome
  document.getElementById("usuarioNome").innerText = "Usuário: " + user.nome;

  // 🔥 mostra lote correto
  document.getElementById(user.lote).style.display = "block";

  fetch(SCRIPT_URL + "?acesso=" + acesso)
    .then(res => res.json())
    .then(dados => {

      if (dados.erro) {
        bloquearTela("Acesso negado");
        return;
      }

      dados.forEach(i => i.dataObj = parseDataBR(i.data));
      dados.sort((a,b) => b.dataObj - a.dataObj);

      document.getElementById("atualizacao").innerText =
        "Atualizado: " + new Date().toLocaleTimeString("pt-BR");

      let htmlCards = "";
      let htmlTabela = "";

      dados.forEach(item => {
        const v = formatarValor(item.valor);

        htmlCards += `
          <div class="card">
            <div class="linha"><span>Data:</span><span>${item.data}</span></div>
            <div class="linha"><span>Barbeiro:</span><strong>${item.barbeiro}</strong></div>
            <div class="linha"><span>Forma:</span><span>${item.forma}</span></div>
            <div class="linha"><span>Valor:</span><span class="${v.classe}">${v.texto}</span></div>
          </div>
        `;

        htmlTabela += `
          <tr>
            <td>${item.data}</td>
            <td>${item.barbeiro}</td>
            <td>${item.forma}</td>
            <td class="${v.classe}">${v.texto}</td>
          </tr>
        `;
      });

      document.getElementById("cards").innerHTML = htmlCards;
      document.getElementById("tabela").innerHTML = htmlTabela;

    })
    .catch(() => bloquearTela("Erro ao carregar"));
}

setInterval(carregarDados, 10000);
carregarDados();
</script>

</body>
</html>
