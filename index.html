<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dados</title>
</head>

<body>

<h3>Planilha</h3>

<div id="dados">Carregando...</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlvzX6W8ZPYB2QSicxv6LXWv0Xc1TuhcoSbcCd5JskarjMueLhZzwuTzjPfZXPgNozYrjxdfmOEqIB/pub?gid=85219282&single=true&output=csv";

fetch(URL)
  .then(res => res.text())
  .then(texto => {
    const linhas = texto.split("\n");
    let html = "";

    // ✅ Cabeçalho
    html += "<b>Data | Barbeiro | FormaPG | Valor</b><br>";

    linhas.forEach((linha, index) => {
      if (index === 0) return; // pula cabeçalho da planilha

      const colunas = linha.split(",");

      const data = colunas[1]  || "";
      const barbeiro = colunas[6]  || "";
      const forma = colunas[26] || "";
      const valor = colunas[27] || "";

      html += data + " | " + barbeiro + " | " + forma + " | " + valor + "<br>";
    });

    document.getElementById("dados").innerHTML = html;
  })
  .catch(() => {
    document.getElementById("dados").innerHTML = "Erro ao carregar";
  });
</script>

</body>
</html>
