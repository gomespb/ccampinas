<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    font-family: Arial;
    background: #0b0f1a;
    color: #fff;
    margin: 0;
    padding: 15px;
  }

  h2 {
    text-align: center;
    margin-bottom: 15px;
  }

  .card {
    background: #111827;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.3);
  }

  .linha {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    margin: 3px 0;
  }

  .valor {
    color: #22c55e;
    font-weight: bold;
  }

  .erro {
    color: red;
    text-align: center;
  }
</style>

</head>

<body>

<h2>Comandas</h2>

<div id="conteudo"></div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbwYy5C-fhdIHgfu04yTE0CWtaokrgN-kQEuOUe9JprV_JrJ3rZQHRHTIr_J4rwqjbzWYQ/exec";

// pega acesso da URL (?acesso=Claudia260225)
const params = new URLSearchParams(window.location.search);
const acesso = params.get("acesso") || "boleta1981";

async function carregarDados() {
  try {
    const response = await fetch(`${URL}?acesso=${acesso}`);
    const dados = await response.json();

    const container = document.getElementById("conteudo");
    container.innerHTML = "";

    if (dados.erro) {
      container.innerHTML = `<p class="erro">${dados.erro}</p>`;
      return;
    }

    // inverter ordem (último primeiro)
    dados.reverse();

    dados.forEach(item => {

      // formatar data
      let dataFormatada = item.dataHora;

      if (item.dataHora) {
        const d = new Date(item.dataHora.replace(" ", "T"));
        dataFormatada = d.toLocaleString("pt-BR");
      }

      // formatar valor
      let valorFormatado = "R$ 0,00";

      if (item.AB > 2) {
        valorFormatado = item.AB.toLocaleString("pt-BR", {
          style: "currency",
          currency: "BRL"
        });
      } else {
        valorFormatado = item.AB;
      }

      const card = `
        <div class="card">
          <div class="linha"><strong>Data:</strong> ${dataFormatada}</div>
          <div class="linha"><strong>Barbeiro:</strong> ${item.barbeiro}</div>
          <div class="linha"><strong>Forma:</strong> ${item.AA}</div>
          <div class="linha valor">${valorFormatado}</div>
        </div>
      `;

      container.innerHTML += card;
    });

  } catch (erro) {
    document.getElementById("conteudo").innerHTML =
      `<p class="erro">Erro ao carregar dados</p>`;
  }
}

// atualizar a cada 10 segundos
setInterval(carregarDados, 10000);

// carregar ao abrir
carregarDados();
</script>

</body>
</html>
