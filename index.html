<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dados</title>
</head>

<body>

<h3>Planilha</h3>
<div id="dados">Carregando...</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTlvzX6W8ZPYB2QSicxv6LXWv0Xc1TuhcoSbcCd5JskarjMueLhZzwuTzjPfZXPgNozYrjxdfmOEqIB/pub?gid=85219282&single=true&output=csv";

fetch(URL)
  .then(res => res.text())
  .then(texto => {
    const linhas = texto.split("\n");
    let html = "";

    linhas.forEach(linha => {
      html += linha + "<br>";
    });

    document.getElementById("dados").innerHTML = html;
  })
  .catch(() => {
    document.getElementById("dados").innerHTML = "Erro ao carregar";
  });
</script>

</body>
</html>
