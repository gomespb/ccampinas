<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas Campinas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, sans-serif; background: #0b0f1a; color: #fff; text-align: center; margin: 0; padding: 15px; }
  .table-container { width: 100%; overflow-x: auto; }
  table { margin: auto; border-collapse: collapse; width: 100%; max-width: 1000px; background: #121826; border-radius: 10px; overflow: hidden; }
  th { background: #1f2937; color: #00ff88; text-transform: uppercase; font-size: 13px; padding: 12px; text-align: left; }
  td { color: #ffffff !important; padding: 12px; border-bottom: 1px solid #1f2937; text-align: left; }
  tr:hover { background: #1a2332; }
  
  @media (max-width: 600px) {
    thead { display: none; }
    tr { display: block; margin-bottom: 12px; background: #121826; border-radius: 10px; padding: 10px; }
    td { display: block; border: none; padding: 6px 0; font-size: 14px; }
    td::before { font-weight: bold; color: #00ff88; display: block; font-size: 12px; margin-bottom: 2px; }
    td:nth-child(1)::before { content: "Data e Hora"; }
    td:nth-child(2)::before { content: "Barbeiro"; }
    td:nth-child(3)::before { content: "Forma PG"; }
    td:nth-child(4)::before { content: "Valor"; }
  }
</style>
</head>
<body>

<h2>Comandas Campinas 🔐</h2>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Data e Hora</th>
        <th>Barbeiro</th>
        <th>Forma PG</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="tabela">
      <tr><td colspan="4">Buscando informações...</td></tr>
    </tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const acesso = params.get("acesso") ?? "";
const API = "https://script.google.com/macros/s/AKfycbxUgo81BIRhLoWNCaOteXFgXqsdg4U5f5bN806D69B13RlzjJQgmdheC05FKzmVDTyqqg/exec";

function formatarMoeda(valor) {
  const numero = parseFloat(valor);
  return isNaN(numero) ? "R$ 0,00" : numero.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

// ✅ CONCILIAÇÃO: Formata a data recebida para o padrão BR
function exibirDataBR(textoData) {
  if (!textoData) return "---";
  
  // Substitui o espaço por 'T' para garantir compatibilidade com Safari/iOS
  const dataLimpa = textoData.replace(" ", "T");
  const d = new Date(dataLimpa);
  
  if (isNaN(d.getTime())) return textoData; // Se falhar, mostra como veio

  const dia = String(d.getDate()).padStart(2, '0');
  const mes = String(d.getMonth() + 1).padStart(2, '0');
  const ano = d.getFullYear();
  const hora = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');

  return `${dia}/${mes}/${ano} ${hora}:${min}`;
}

function carregarDados() {
  const tabela = document.getElementById("tabela");

  fetch(`${API}?acesso=${acesso}`)
    .then(res => res.json())
    .then(data => {
      if (data.erro) {
        tabela.innerHTML = "<tr><td colspan='4'>🔒 Acesso negado</td></tr>";
        return;
      }

      tabela.innerHTML = "";
      const lista = Array.isArray(data) ? data.reverse() : [];

      lista.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${exibirDataBR(item.dataHora)}</td>
          <td>${item.barbeiro || ""}</td>
          <td>${item.AA || ""}</td>
          <td>
            ${item.AA?.toLowerCase() === "assinatura" ? (item.AB || "0") : formatarMoeda(item.AB)}
          </td>
        `;
        tabela.appendChild(tr);
      });
    })
    .catch(err => {
      console.error(err);
      tabela.innerHTML = "<tr><td colspan='4'>⚠️ Erro ao conectar</td></tr>";
    });
}

carregarDados();
setInterval(carregarDados, 20000); // Atualiza a cada 20 segundos
</script>
</body>
</html>
