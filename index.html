<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Comandas Campinas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: Arial, sans-serif; background: #0b0f1a; color: #fff; text-align: center; margin: 0; padding: 15px; }
  .table-container { width: 100%; overflow-x: auto; }
  table { margin: auto; border-collapse: collapse; width: 100%; max-width: 1000px; background: #121826; border-radius: 10px; overflow: hidden; }
  th { background: #1f2937; color: #00ff88; text-transform: uppercase; font-size: 13px; padding: 12px; text-align: left; }
  td { color: #ffffff !important; padding: 12px; border-bottom: 1px solid #1f2937; text-align: left; }
  tr:hover { background: #1a2332; }
  @media (max-width: 600px) {
    thead { display: none; }
    tr { display: block; margin-bottom: 12px; background: #121826; border-radius: 10px; padding: 10px; }
    td { display: block; border: none; padding: 6px 0; font-size: 14px; }
    td::before { font-weight: bold; color: #00ff88; display: block; font-size: 12px; margin-bottom: 2px; }
    td:nth-child(1)::before { content: "Data e Hora"; }
    td:nth-child(2)::before { content: "Barbeiro"; }
    td:nth-child(3)::before { content: "Forma PG"; }
    td:nth-child(4)::before { content: "Valor"; }
  }
</style>
</head>
<body>

<h2>Comandas Campinas 🔐</h2>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Data e Hora</th>
        <th>Barbeiro</th>
        <th>Forma PG</th>
        <th>Valor</th>
      </tr>
    </thead>
    <tbody id="tabela">
      <tr><td colspan="4">Carregando dados...</td></tr>
    </tbody>
  </table>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const acesso = params.get("acesso") ?? "";
const API = "https://script.google.com/macros/s/AKfycbyHUG9oKBjNZGSgPCdcRt6Kequ5Uo9h9IaF_h0-8eq2aGJZ6jHEfij22p8IgzSHuhM5Mw/exec";

function formatarMoeda(valor) {
  const numero = parseFloat(valor);
  if (isNaN(numero)) return "R$ 0,00";
  return numero.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function formatarData(dataRaw) {
  if (!dataRaw) return "---";
  let d;

  // Se for objeto do Google {year, month, day...}
  if (typeof dataRaw === 'object' && dataRaw !== null && !dataRaw.getTime) {
    const ano = dataRaw.year || new Date().getFullYear();
    const mes = (dataRaw.month !== undefined) ? dataRaw.month : new Date().getMonth();
    const dia = dataRaw.day || 1;
    const hora = dataRaw.hours || dataRaw.hour || 0;
    const min = dataRaw.minutes || dataRaw.minute || 0;
    d = new Date(ano, mes, dia, hora, min);
  } 
  else {
    d = new Date(dataRaw);
  }

  if (isNaN(d.getTime())) {
    // Se ainda assim falhar, retorna o texto bruto se for string
    return typeof dataRaw === 'string' ? dataRaw : "---";
  }

  const diaF = String(d.getDate()).padStart(2, "0");
  const mesF = String(d.getMonth() + 1).padStart(2, "0");
  const anoF = d.getFullYear();
  const horaF = String(d.getHours()).padStart(2, "0");
  const minF = String(d.getMinutes()).padStart(2, "0");

  return `${diaF}/${mesF}/${anoF} ${horaF}:${minF}`;
}

function carregarDados() {
  const tabela = document.getElementById("tabela");

  fetch(`${API}?acesso=${acesso}`)
    .then(res => res.json())
    .then(data => {
      if (data.erro) {
        tabela.innerHTML = "<tr><td colspan='4'>🔒 Acesso negado</td></tr>";
        return;
      }

      tabela.innerHTML = "";
      
      // Inverte para ver os mais recentes primeiro
      const lista = Array.isArray(data) ? data.reverse() : [];

      lista.forEach(item => {
        // LÓGICA CORINGA: Procura qualquer coluna que sugira ser a data
        let dataValor = null;
        for (let chave in item) {
          const c = chave.toLowerCase();
          if (c.includes("data") || c.includes("time") || c.includes("carimbo") || c.includes("timestamp")) {
            dataValor = item[chave];
            break;
          }
        }
        // Se não achou por nome, tenta a primeira propriedade do objeto
        if (dataValor === null) dataValor = Object.values(item)[0];

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${formatarData(dataValor)}</td>
          <td>${item.barbeiro ?? "---"}</td>
          <td>${item.AA ?? "---"}</td>
          <td>
            ${item.AA?.toLowerCase() === "assinatura" ? (item.AB ?? "0") : formatarMoeda(item.AB)}
          </td>
        `;
        tabela.appendChild(tr);
      });
    })
    .catch(err => {
      console.error(err);
      tabela.innerHTML = "<tr><td colspan='4'>⚠️ Erro na conexão</td></tr>";
    });
}

carregarDados();
setInterval(carregarDados, 15000);
</script>

</body>
</html>
